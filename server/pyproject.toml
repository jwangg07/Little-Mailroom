[project]
name = "server"
version = "0.1.0"
description = "Mini Mailroom API and Gmail integration"
readme = "README.md"
authors = [
    { name = "Jerry Wang", email = "wangjerry1007@gmail.com" }
]
requires-python = ">=3.11.1"
dependencies = [
    "boto3>=1.43.127",
    "cryptography>=46,<51",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "google-auth-oauthlib>=1.2.2,<2",
    "pydantic-settings>=2.16.2",
    "requests>=2.32,<3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
